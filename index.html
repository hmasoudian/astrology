<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آموزش و بانک اطلاعاتی آسترولوژی</title>
  <style>
    body { font-family: Tahoma, sans-serif; line-height: 1.6; margin: 20px; background-color: #f9f9f9; color: #333; }
    h1 { text-align: center; color: #2c3e50; }
    .section { background: #fff; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card { border-bottom: 1px solid #eee; padding: 10px 0; }
    .card:last-child { border-bottom: none; }
    .badge { background: #3498db; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; }
  </style>
</head>
<body>

  <h1>بانک اطلاعاتی نجوم و آسترولوژی</h1>

  <!-- ۱. سیارات -->
  <div class="section">
    <h2>۱. سیارات (Planets)</h2>
    <div id="planets-list"></div>
  </div>

  <!-- ۲. برج‌ها -->
  <div class="section">
    <h2>۲. برج‌ها / نشان‌ها (Zodiac Signs)</h2>
    <div id="signs-list"></div>
  </div>

  <!-- ۳. خانه‌ها -->
  <div class="section">
    <h2>۳. خانه‌ها (Houses)</h2>
    <div id="houses-list"></div>
  </div>

  <div class="section">
    <h2>۴. زوایا (Aspects)</h2>
    <div id="aspects-list"></div>
  </div>

    <div id="patterns-list"></div>
  </div>

        { "name_fa": "تثلیث", "angle": "۱۲۰ درجه", "keywords": "استعداد آماده + جریان طبیعی + خطر راحت‌طلبی" },
        { "name_fa": "تقابل", "angle": "۱۸۰ درجه", "keywords": "رویارویی + تنش مستقیم + نیاز مبرم به تعادل" }
      ],
      "patterns": [
        { "name_fa": "استلیوم", "concept": "تمرکز فوق‌العاده شدید و عمیق انرژی در یک حوزه مشخص از زندگی." },
        { "name_fa": "مثلث بزرگ", "concept": "جریان فوق‌العاده روان انرژی در یک عنصر. موهبت استعدادها و ظرفیت‌های خلاق." },
        { "name_fa": "صلیب کیهانی", "concept": "تنش روانی، بحران و فشار سنگین زندگی از چهار جهت متفاوت." },

    // ۱. سیارات
    const planetsContainer = document.getElementById('planets-list');
    db.planets.forEach(p => {
      planetsContainer.innerHTML += `<div class="card"><strong>${p.symbol} ${p.name_fa}</strong>: ${p.core_function}</div>`;
    });

    // ۲. برج‌ها
    const signsContainer = document.getElementById('signs-list');
    db.zodiac_signs.forEach(s => {
      signsContainer.innerHTML += `<div class="card"><strong>${s.emoji} ${s.name_fa}</strong> - ${s.archetype_short}</div>`;
    });

    // ۳. خانه‌ها
    const housesContainer = document.getElementById('houses-list');
    db.houses.forEach(h => {
      housesContainer.innerHTML += `<div class="card"><strong>خانه ${h.number} (${h.key_code})</strong>: ${h.domain}</div>`;
    });

    // ۴. زوایا
    const aspectsContainer = document.getElementById('aspects-list');
    db.aspects.forEach(a => {
      aspectsContainer.innerHTML += `<div class="card"><strong>${a.name_fa} (${a.angle})</strong>: <span class="badge">${a.keywords}</span></div>`;
    });

    // ۵. الگوها
    const patternsContainer = document.getElementById('patterns-list');
    db.patterns.forEach(pt => {
      patternsContainer.innerHTML += `<div class="card"><strong>${pt.name_fa}</strong>: ${pt.concept}</div>`;
    });

</body>
</html>
