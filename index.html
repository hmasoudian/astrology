<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحلیل چارت آسترولوژی</title>
  <style>
    /* ۱. ریست و تنظیمات پایه برای جلوگیری از بهم‌ریختگی layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }

    /* ۲. محدود کردن عرض صفحه جهت جلوگیری از کشیده شدن بیش از حد */
    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    /* ۳. کارت‌های اصلی بخش‌ها */
    .section {
      background: #ffffff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e1e8ed;
    }

    .section h2 {
      color: #34495e;
      font-size: 1.3rem;
      margin-bottom: 15px;
      border-bottom: 2px solid #ecf0f1;
      padding-bottom: 8px;
    }

    /* ۴. استایل آیتم‌های داخل لیست */
    .card {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card:last-child {
      border-bottom: none;
    }

    .card-header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .planet-title {
      font-weight: bold;
      font-size: 1.05rem;
      color: #1a252f;
    }

    /* ۵. نشان‌ها (Badges) */
    .badge {
      background-color: #3498db;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.82em;
      display: inline-block;
    }

    .badge-house {
      background-color: #8e44ad;
    }

    .badge-empty {
      background-color: #95a5a6;
    }

    .description {
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>تحلیل جایگاه سیارات در چارت</h1>

    <!-- ۱. وضعیت سیارات -->
    <div class="section">
      <h2>۱. جایگاه سیارات (Planets Placement)</h2>
      <div id="planets-list"></div>
    </div>

    <!-- ۲. نمای خانه‌ها -->
    <div class="section">
      <h2>۲. وضعیت خانه‌ها (Houses Overview)</h2>
      <div id="houses-list"></div>
    </div>
  </div>

  <script>
    // داده‌های سیارات
    const planetsData = [
      { name: "خورشید", symbol: "☉", sign: "اسد", house: 5, function: "هویت، اراده و مرکز ثقل روان" },
      { name: "ماه", symbol: "☽", sign: "حوت", house: 12, function: "احساسات، غرایز و نیازهای عاطفی" },
      { name: "عطارد", symbol: "☿", sign: "اسد", house: 5, function: "ذهن منطقی، ارتباطات و تحلیل" },
      { name: "زهره", symbol: "♀", sign: "میزان", house: 7, function: "عشق، ارزش‌ها و روابط" },
      { name: "مریخ", symbol: "♂", sign: "عقرب", house: 8, function: "انرژی حیاتی، اقدام و انگیزه" },
      { name: "مشتری", symbol: "♃", sign: "قوس", house: 9, function: "رشد، توسعه و فلسفه زندگی" },
      { name: "زحل", symbol: "♄", sign: "جدی", house: 10, function: "ساختار، انضباط و مسئولیت" },
      { name: "اورانوس", symbol: "♅", sign: "دلو", house: 11, function: "نوآوری، استقلال و بیداری" },
      { name: "نپتون", symbol: "♆", sign: "حوت", house: 12, function: "الهام، معنویت و شهود" },
      { name: "پلوتو", symbol: "♇", sign: "عقرب", house: 8, function: "تحول بنیادین و قدرت پنهان" }
    ];

    // رندر لیست سیارات
    const planetsContainer = document.getElementById('planets-list');
    let planetsHTML = '';
    planetsData.forEach(p => {
      planetsHTML += `
        <div class="card">
          <div class="card-header">
            <span class="planet-title">${p.symbol} ${p.name}</span>
            <span class="badge">نشان: ${p.sign}</span>
            <span class="badge badge-house">خانه ${p.house}</span>
          </div>
          <div class="description">${p.function}</div>
        </div>`;
    });
    planetsContainer.innerHTML = planetsHTML;

    // رندر نمای خانه‌ها
    const housesContainer = document.getElementById('houses-list');
    let housesHTML = '';
    for (let houseNum = 1; houseNum <= 12; houseNum++) {
      const planetsInHouse = planetsData.filter(p => p.house === houseNum);

      let houseDetails = "";
      if (planetsInHouse.length > 0) {
        const names = planetsInHouse.map(p => `${p.symbol} ${p.name}`).join('، ');
        houseDetails = `حاوی سیارات: <strong>${names}</strong> (${planetsInHouse.length} سیاره)`;
      } else {
        houseDetails = `<span class="badge badge-empty">خانه خالی</span>`;
      }

      housesHTML += `
        <div class="card">
          <div class="card-header">
            <strong>خانه ${houseNum}:</strong>
            <span>${houseDetails}</span>
          </div>
        </div>`;
    }
    housesContainer.innerHTML = housesHTML;
  </script>

</body>
</html>
