<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه تحلیل جامع چارت نجومی - بر اساس آموزه‌های استاد صالحی</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            background: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        select, button, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button.btn-primary:hover {
            background-color: #d35400;
        }

        button.btn-success {
            background-color: #27ae60;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .output-box {
            background: #fafafa;
            border-right: 4px solid var(--accent-color);
            padding: 15px;
            margin-top: 15px;
        }

        .house-status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .house-btn {
            padding: 8px;
            text-align: center;
            background: #e0e0e0;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        .house-btn.active {
            background: #27ae60;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>📘 سامانه تحلیل و ترکیب سه‌گانه/چهارگانه چارت</h2>
        <p>بر اساس متد آموزش استاد صالحی + پایگاه جامع JSON</p>
    </div>

    <div class="grid-layout">
        <!-- بخش انتخاب و تولید -->
        <div class="card">
            <h3>۱. انتخاب عناصر چارت</h3>
            
            <div class="form-group">
                <label>انتخاب خانه (از ۱ تا ۱۲):</label>
                <select id="select-house" onchange="updateHouseUI()"></select>
            </div>

            <div class="form-group">
                <label>سیاره:</label>
                <select id="select-planet"></select>
            </div>

            <div class="form-group">
                <label>برج (نشان):</label>
                <select id="select-sign"></select>
            </div>

            <div class="form-group">
                <label>جنبه / زاویه (اختیاری):</label>
                <select id="select-aspect">
                    <option value="">-- بدون جنبه (تفسیر سه‌گانه ساده) --</option>
                </select>
            </div>

            <button class="btn-primary" onclick="generateAnalysis()">تولید ترکیب پیش‌فرض</button>

            <div class="output-box" id="analysis-preview" style="display:none;">
                <h4>پیش‌نمایش تعبیر سه‌گانه:</h4>
                <div id="step-by-step"></div>
                <hr>
                <label>متن ترکیبی و ویرایش نهایی شما:</label>
                <textarea id="final-user-text" rows="6"></textarea>
                <button class="btn-success" onclick="saveHouseData()">ثبت و ذخیره در خانه انتخابی</button>
            </div>
        </div>

        <!-- وضعیت چارت ۱۲ خانه -->
        <div class="card">
            <h3>۲. وضعیت چارت فرد (۱۲ خانه)</h3>
            <p style="font-size: 12px; color: #666;">با کلیک روی هر خانه وضعیت ذخیره‌شده آن را مشاهده یا ویرایش کنید:</p>
            
            <div class="house-status-grid" id="house-grid"></div>

            <div style="margin-top: 30px;">
                <button class="btn-primary" style="background-color: #2980b9;" onclick="exportFullChartHTML()">
                    📥 خروجی نهایی کل چارت (فایل HTML)
                </button>
                <button onclick="clearAllData()" style="margin-top: 10px; background: #e74c3c; color: white; border:none; padding:5px; cursor:pointer;">
                    بازنشانی کل اطلاعات
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// ۱. بارگذاری داده‌های کامل JSON
let db = {};
let userChart = {}; // ذخیره وضعیت ۱۲ خانه

// مقداردهی اولیه
async function init() {
    try {
        const res = await fetch('astrology-database.json');
        db = await res.json();
        
        populateDropdowns();
        renderHouseGrid();
        loadFromLocalStorage();
    } catch (e) {
        console.error("خطا در دریافت فایل JSON:", e);
    }
}

function populateDropdowns() {
    // خانه‌ها
    const houseSel = document.getElementById('select-house');
    db.houses.forEach(h => {
        houseSel.innerHTML += `<option value="${h.number}">خانه ${h.number}: ${h.key_code}</option>`;
    });

    // سیارات
    const planetSel = document.getElementById('select-planet');
    db.planets.forEach(p => {
        planetSel.innerHTML += `<option value="${p.name_fa}">${p.symbol} ${p.name_fa} (${p.core_function.split('،')[0]})</option>`;
    });

    // بروج
    const signSel = document.getElementById('select-sign');
    db.zodiac_signs.forEach(s => {
        signSel.innerHTML += `<option value="${s.name_fa}">${s.emoji} ${s.name_fa} (${s.element})</option>`;
    });

    // جنبه‌ها
    const aspectSel = document.getElementById('select-aspect');
    db.aspects.forEach(a => {
        aspectSel.innerHTML += `<option value="${a.name_fa}">${a.symbol} ${a.name_fa} (${a.angle}) - ${a.keywords}</option>`;
    });
}

// ۲. الگوریتم تولید تفسیر سه‌گانه براساس فرمول استاد صالحی
function generateAnalysis() {
    const planet = db.planets.find(p => p.name_fa === document.getElementById('select-planet').value);
    const sign = db.zodiac_signs.find(s => s.name_fa === document.getElementById('select-sign').value);
    const house = db.houses.find(h => h.number == document.getElementById('select-house').value);
    const aspectName = document.getElementById('select-aspect').value;
    const aspect = db.aspects.find(a => a.name_fa === aspectName);

    let htmlStep = `
        <p><strong>۱. سیاره (${planet.name_fa}):</strong> نیاز به <em>${planet.basic_needs[0]}</em> (${planet.core_function})[span_0](start_span)[span_0](end_span)</p>
        <p><strong>۲. برج (${sign.name_fa}):</strong> با سبک <em>${sign.keywords.join('، ')}</em> (${sign.strategy})[span_1](start_span)[span_1](end_span)</p>
        <p><strong>۳. خانه (خانه ${house.number}):</strong> در عرصه <em>${house.key_code}</em> (${house.domain})[span_2](start_span)[span_2](end_span)</p>
    `;

    if (aspect) {
        htmlStep += `<p><strong>۴. جنبه/زاویه (${aspect.name_fa}):</strong> با کیفیت <em>${aspect.concept}</em>[span_3](start_span)[span_3](end_span)</p>`;
    }

    document.getElementById('step-by-step').innerHTML = htmlStep;

    // متن پیشنهادی بر اساس قاعده طلایی
    let textTemplate = `«من نیاز به ${planet.basic_needs[0]} و ${planet.core_function.split('،')[0]} را، به سبکِ ${sign.keywords.join(' و ')} (${sign.strategy})، در عرصه‌ی ${house.title} انجام می‌دهم.»\n\n`;
    textTemplate += `تعبیر روان:\nشما در حوزه ${house.key_code}، نیاز دارید تا مثل یک ${sign.symbol_animal || sign.name_fa} عمل کنید. ${planet.core_question}\n\n`;
    textTemplate += `🚨 چالش و سایه روانی:\n${planet.shadow}\nسایه برج: ${sign.shadow}`;

    if (aspect) {
        textTemplate += `\n\n⚛️ تاثیر جنبه (${aspect.name_fa}):\nاین وضعیت تحت تاثیر زاویه ${aspect.name_fa} قرار دارد (${aspect.keywords}). ${aspect.concept}`;
    }

    document.getElementById('final-user-text').value = textTemplate;
    document.getElementById('analysis-preview').style.display = 'block';
}

// ۳. مدیریت ۱۲ خانه و ذخیره‌سازی
function renderHouseGrid() {
    const grid = document.getElementById('house-grid');
    grid.innerHTML = '';
    for(let i = 1; i <= 12; i++) {
        const isFilled = userChart[i] ? 'active' : '';
        grid.innerHTML += `<div class="house-btn ${isFilled}" onclick="selectHouseFromGrid(${i})">خانه ${i}<br>${userChart[i] ? '✅ پر شده' : '⚪ خالی'}</div>`;
    }
}

function saveHouseData() {
    const hNum = document.getElementById('select-house').value;
    const planet = document.getElementById('select-planet').value;
    const sign = document.getElementById('select-sign').value;
    const aspect = document.getElementById('select-aspect').value;
    const text = document.getElementById('final-user-text').value;

    userChart[hNum] = {
        planet,
        sign,
        aspect,
        text,
        timestamp: new Date().toLocaleString('fa-IR')
    };

    localStorage.setItem('userAstrologyChart', JSON.stringify(userChart));
    renderHouseGrid();
    alert(`اطلاعات خانه ${hNum} با موفقیت ثبت شد.`);
}

function selectHouseFromGrid(hNum) {
    document.getElementById('select-house').value = hNum;
    if(userChart[hNum]) {
        document.getElementById('final-user-text').value = userChart[hNum].text;
        document.getElementById('analysis-preview').style.display = 'block';
    } else {
        document.getElementById('analysis-preview').style.display = 'none';
    }
}

function loadFromLocalStorage() {
    const saved = localStorage.getItem('userAstrologyChart');
    if(saved) {
        userChart = JSON.parse(saved);
        renderHouseGrid();
    }
}

function clearAllData() {
    if(confirm('آیا از پاک کردن تمامی اطلاعات چارت اطمینان دارید؟')) {
        userChart = {};
        localStorage.removeItem('userAstrologyChart');
        renderHouseGrid();
        document.getElementById('analysis-preview').style.display = 'none';
    }
}

// ۴. تولید خروجی فایل HTML مستقل برای کاربر
function exportFullChartHTML() {
    let htmlContent = `
    <!DOCTYPE html>
    <html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <title>گزارش تحلیل کامل چارت نجومی شخصی</title>
        <style>
            body { font-family: 'Tahoma', sans-serif; background: #f9f9f9; padding: 30px; line-height: 1.8; direction: rtl; }
            .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
            h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #e67e22; padding-bottom: 10px; }
            .house-card { background: #fcfcfc; border-right: 5px solid #2980b9; margin-bottom: 25px; padding: 20px; border-radius: 4px; border: 1px solid #eee; }
            .house-title { font-size: 18px; color: #d35400; font-weight: bold; margin-bottom: 10px; }
            .meta { font-size: 13px; color: #7f8c8d; margin-bottom: 15px; background: #eef2f5; padding: 5px 10px; border-radius: 3px; display: inline-block; }
            .content { white-space: pre-line; color: #333; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>📘 شناسنامه و تفسیر جامع ۱۲ خانه چارت</h1>
            <p style="text-align:center;">تنظیم شده بر اساس متد سه‌گانه (سیاره، برج، خانه)</p>
            <hr><br>
    `;

    for(let i = 1; i <= 12; i++) {
        if(userChart[i]) {
            const h = userChart[i];
            htmlContent += `
                <div class="house-card">
                    <div class="house-title">🏛️ خانه ${i} چارت شخصی</div>
                    <div class="meta">ترکيب: <strong>${h.planet}</strong> در برج <strong>${h.sign}</strong> ${h.aspect ? `(زاویه: ${h.aspect})` : ''}</div>
                    <div class="content">${h.text}</div>
                </div>
            `;
        } else {
            htmlContent += `
                <div class="house-card" style="border-right-color: #ccc; opacity: 0.6;">
                    <div class="house-title">🏛️ خانه ${i}</div>
                    <div class="content"><em>اطلاعاتی برای این خانه ثبت نشده است.</em></div>
                </div>
            `;
        }
    }

    htmlContent += `</div></body></html>`;

    // دانلود فایل HTML
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Astrology_Chart_Analysis_${new Date().toISOString().slice(0,10)}.html`;
    a.click();
}

window.onload = init;
</script>
</body>
</html>
